# Server Configuration
server.port=8001
spring.application.name=civicconnect-ai-microservice

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}

# Qdrant Configuration
qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}

# Django Backend
django.backend.url=${DJANGO_BACKEND_URL:http://127.0.0.1:8000}

# Logging
logging.level.com.civicconnect.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n


